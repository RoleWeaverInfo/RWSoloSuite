name: Build release packages
on:
  push:
    branches: [codex/ai-npc-parity]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux-x64, os: ubuntu-24.04}
          - {name: Linux-arm64, os: ubuntu-24.04-arm}
          - {name: macOS-x64, os: macos-15-intel}
          - {name: macOS-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux compiler dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison cmake g++ zlib1g-dev
      - name: macOS compiler dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-guardrails.txt -r requirements-platform.txt pyinstaller==6.22.3
      - run: python installer/build_nwnsc.py
      - name: Unit and interface checks
        run: |
          python -m unittest discover -s tests
          for test in tests/*_checks.js; do node "$test"; done
      - name: Build and smoke-test bundled application
        run: python build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*-${{ matrix.name }}.*
          if-no-files-found: error
  windows:
    name: Windows-x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-guardrails.txt
      - run: python -m unittest discover -s tests
      - name: Interface checks
        run: Get-ChildItem tests/*_checks.js | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Fetch verified build tools
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/Fetch-BuildTools.ps1
      - run: python build_installer.py
      - name: Install, start, upgrade and uninstall without external Python
        run: |
          $setup = Get-ChildItem dist/*-Setup-x64.exe | Select-Object -First 1
          python installer/smoke_test.py $setup.FullName --without-game
      - name: Retain installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-checks
          path: |
            data/installer-smoke-result.json
            data/installer-smoke-*/*.log
          if-no-files-found: ignore
      - run: python package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-and-source
          path: |
            dist/*-Setup-x64.exe*
            dist/*-source.zip*
            dist/*-payload.json
            dist/The-Emberseal-of-Briarwatch-*.zip*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-and-source'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 'Linux-*'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 'macOS-*'
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(python -c 'from rwstudio import VERSION; print(VERSION)')" = "$version"
          notes="docs/RELEASE-${version}.md"
          test -f "$notes"
          flags=(--latest)
          if [[ "$version" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag "${flags[@]}" --title "Role Weaver Module Studio $GITHUB_REF_NAME — AI dialogue controls and faster conversions" --notes-file "$notes"
